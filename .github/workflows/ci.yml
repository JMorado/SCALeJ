name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          environments: ci-cpu-py312
          cache: true

      - name: Lint & format check
        run: pixi run --environment ci-cpu-py312 lint-check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            environment: ci-cpu-py311
          - python-version: "3.12"
            environment: ci-cpu-py312
          - python-version: "3.13"
            environment: ci-cpu-py313

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}
          cache: true

      - name: Run tests
        run: pixi run --environment ${{ matrix.environment }} test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false
