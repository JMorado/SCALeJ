name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  test-matrix:
    name: Test (py${{ matrix.python-version }})
    needs: pre-commit
    runs-on: ubuntu-latest

    env:
      PIXI_ENV: ci-cpu-py${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["311", "312", "313"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.63.2
          cache: true
          environments: ${{ env.PIXI_ENV }}

      - name: Run tests
        run: pixi run -e "${{ env.PIXI_ENV }}" test

      - name: CodeCov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '312'
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [[ "${{ needs.test-matrix.result }}" != "success" ]]; then
            echo "One or more test matrix jobs failed or were cancelled."
            exit 1
          fi
